<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <p>Unordered List: list and group related items for better readability</p>
    <!-- Ul: unordered list | li: list | Items are listed with bullets -->
    <ul> 
        <li>Apple</li>
        <li>Banana</li>
    </ul>

    <p>Ordered List: ol: list the items by numbering them</p>
    <ol>
        <li>Laptop</li>
        <li>Phone</li>
        <li>ipad</li>
    </ol>
</body>
</html>
